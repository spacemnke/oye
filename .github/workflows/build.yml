name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    # People, messages and invite rules don't need a Mac.
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test OyeCore
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/core.log
      # The log goes to its own branch so it can be read without opening GitHub.
      - name: Share the log
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/share && cd /tmp/share && git init -q .
          tail -c 200000 /tmp/core.log > core.log 2>/dev/null || echo "no log" > core.log
          echo "$STATUS $GITHUB_SHA run $GITHUB_RUN_NUMBER" > core.status
          git add . && git -c user.name=oye-ci -c user.email=oye-ci@users.noreply.github.com commit -qm "core log for $GITHUB_SHA"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/ci-logs-core

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build and test
        run: |
          set -o pipefail
          {
            xcodebuild -version
            swift --version
            swift build
            swift test
          } 2>&1 | tee /tmp/mac.log

      # The real app in demo mode (placeholder people, no network): its panels drawn to PNGs, plus a
      # capture of the screen with a thread open.
      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          OYE_DEMO=1 OYE_SHOTS=/tmp/shots .build/debug/Oye > /tmp/app.log 2>&1 &
          APP=$!
          sleep 4
          screencapture -x /tmp/shots/screen.png || echo "no screen capture"
          # Drawing the soft shadow without a graphics card is slow.
          for _ in $(seq 1 150); do [ -f /tmp/shots/home.png ] && break; sleep 1; done
          sleep 1
          # If it's stuck, say where.
          if [ ! -f /tmp/shots/home.png ]; then sample $APP 2 -file /tmp/sample.txt > /dev/null 2>&1 || true; fi
          kill $APP || true
          {
            echo "---- app output"; cat /tmp/app.log
            echo "---- shots"; ls -la /tmp/shots
            if [ -f /tmp/sample.txt ]; then echo "---- sample"; head -120 /tmp/sample.txt; fi
          } >> /tmp/mac.log 2>&1

      # Every push packages the app, so there's always a current build to install.
      - name: Package Oye.app
        env:
          OYE_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          scripts/bundle.sh release 2>&1 | tee -a /tmp/mac.log

      # The live check: two copies of the packaged app, as two new people, invite each other and send
      # everything both ways through the real server. It leaves two test accounts behind, so it only
      # runs when the commit message asks for it with [live].
      - name: Live check
        if: contains(github.event.head_commit.message, '[live]')
        continue-on-error: true
        run: |
          mkdir -p /tmp/live
          APP="$GITHUB_WORKSPACE/build/Oye.app/Contents/MacOS/Oye"
          OYE_LIVE=ana OYE_LIVE_DIR=/tmp/live OYE_PROFILE="ana-$GITHUB_RUN_NUMBER" "$APP" > /tmp/live/ana.out 2>&1 &
          ANA=$!
          OYE_LIVE=ben OYE_LIVE_DIR=/tmp/live OYE_PROFILE="ben-$GITHUB_RUN_NUMBER" "$APP" > /tmp/live/ben.out 2>&1 &
          BEN=$!
          for _ in $(seq 1 460); do
            if [ -f /tmp/live/shot-now.mark ] && [ ! -f /tmp/live/screen.png ]; then
              sleep 3
              screencapture -x /tmp/live/screen.png || echo "no screen capture"
            fi
            kill -0 $ANA 2>/dev/null || kill -0 $BEN 2>/dev/null || break
            sleep 1
          done
          kill $ANA $BEN 2>/dev/null || true
          {
            echo "==== live check, run $GITHUB_RUN_NUMBER, $GITHUB_SHA"
            cat /tmp/live/ana.log /tmp/live/ben.log 2>/dev/null || echo "no results written"
            echo "---- ana output"; tail -c 6000 /tmp/live/ana.out
            echo "---- ben output"; tail -c 6000 /tmp/live/ben.out
            ls -la /tmp/live
          } > /tmp/live.log 2>&1
          cat /tmp/live.log
          [ "$(grep -c '^[a-z]* RESULT pass' /tmp/live.log)" = "2" ]

      - uses: actions/upload-artifact@v4
        with:
          name: Oye
          path: |
            build/Oye.zip
            build/Oye-Installer.pkg
          retention-days: 14

      # The installer also goes to its own branch, so it can be fetched without signing in to GitHub.
      - name: Share the installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/built && cd /tmp/built && git init -q .
          cp "$GITHUB_WORKSPACE/build/Oye-Installer.pkg" .
          echo "$GITHUB_SHA run $GITHUB_RUN_NUMBER" > build.txt
          shasum -a 256 Oye-Installer.pkg >> build.txt
          git add . && git -c user.name=oye-ci -c user.email=oye-ci@users.noreply.github.com commit -qm "installer for $GITHUB_SHA"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/ci-build

      - name: Share the log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/share && cd /tmp/share && git init -q .
          tail -c 200000 /tmp/mac.log > mac.log 2>/dev/null || echo "no log" > mac.log
          cp /tmp/shots/*.png . 2>/dev/null || true
          if [ -f /tmp/live.log ]; then
            cp /tmp/live.log live.log
            for f in /tmp/live/*.png /tmp/live/*.html; do [ -f "$f" ] && cp "$f" "live-$(basename "$f")"; done
          fi
          echo "$STATUS $GITHUB_SHA run $GITHUB_RUN_NUMBER" > mac.status
          git add . && git -c user.name=oye-ci -c user.email=oye-ci@users.noreply.github.com commit -qm "mac log for $GITHUB_SHA"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/ci-logs-mac
